[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mssql-pyodbc-mcp"
version = "0.1.0"
description = "Local stdio MCP server for read-only MSSQL access through pyodbc."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyodbc>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mssql-pyodbc-mcp = "mssql_pyodbc_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
